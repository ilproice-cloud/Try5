name: Build RealmForge jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Unzip project (if uploaded as realmforge.zip)
        run: |
          if [ -f realmforge.zip ]; then unzip -q -o realmforge.zip; fi
          if [ -d realmforge ]; then echo "PROJECT_DIR=realmforge" >> $GITHUB_ENV; else echo "PROJECT_DIR=." >> $GITHUB_ENV; fi

      - name: Build
        run: gradle build --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: realmforge-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
