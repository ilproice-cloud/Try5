
name: Build RealmForge

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname 'RealmForge*.zip' \
            ! -iname '*Workflow*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RealmForge project ZIP not found."
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          BUILD_FILE="$(find extracted -type f \
            -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          SETTINGS_FILE="$PROJECT_DIR/settings.gradle"

          if [ -f "$SETTINGS_FILE" ]; then
            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              "$SETTINGS_FILE"
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Collect JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;

          test -n "$(find dist -type f -name '*.jar' -print -quit)"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
