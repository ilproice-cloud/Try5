
name: Build RealmForge

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract RealmForge ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname 'RealmForge*.zip' \
            ! -iname '*Workflow*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RealmForge ZIP not found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          BUILD_FILE="$(find extracted -type f \
            -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Gradle repository conflict
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("settings.gradle")
          if not p.exists():
              raise SystemExit("ERROR: settings.gradle not found")

          s = p.read_text()

          # Remove dependencyResolutionManagement block,
          # including nested braces.
          match = re.search(
              r'\bdependencyResolutionManagement\s*\{',
              s
          )

          if match:
              start = match.start()
              brace = s.find("{", match.start())
              depth = 0
              end = None

              for i in range(brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "ERROR: Could not parse repository block"
                  )

              s = s[:start] + s[end:]

          p.write_text(s)
          print("Updated settings.gradle")
          PY

          echo "---- settings.gradle ----"
          cat settings.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Collect compiled JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} dist/ \;

          if ! find dist -name '*.jar' -print -quit | grep -q .; then
            echo "ERROR: No compiled JAR was produced."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
