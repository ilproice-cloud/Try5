
name: RealmForge Fabric 1.21.1 Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract the correct RealmForge ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="RealmForge-Fabric-1.21.1-Compile-Fix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Upload $ZIP to the repository root."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/realmforge"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/realmforge"

          BUILD_FILE="$(find "$RUNNER_TEMP/realmforge" \
            -type f -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found in ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Fix known source and repository errors
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])

          # Remove repository policy that conflicts with Fabric Loom.
          settings = root / "settings.gradle"
          if settings.exists():
              text = settings.read_text()
              match = re.search(
                  r'(?m)^\s*dependencyResolutionManagement\s*\{',
                  text
              )

              if match:
                  start = match.start()
                  brace = text.find("{", match.start())
                  depth = 0
                  end = None

                  for i in range(brace, len(text)):
                      if text[i] == "{":
                          depth += 1
                      elif text[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break

                  if end is None:
                      raise SystemExit(
                          "Could not safely remove repository block"
                      )

                  text = text[:start] + text[end:]
                  settings.write_text(text)

          # Fix the reported double-to-int compilation error.
          found = False
          for source in root.rglob("*.java"):
              text = source.read_text()
              updated = text.replace(
                  "int gearHp = gearBonus(",
                  "double gearHp = gearBonus("
              )
              if updated != text:
                  source.write_text(updated)
                  found = True
                  print("Fixed:", source)

          if not found:
              print("gearHp declaration already fixed or absent")

          print("Pre-build corrections complete")
          PY

      - name: Compile RealmForge
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Verify and collect mod JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            -exec cp {} "$GITHUB_WORKSPACE/dist/" \;

          if ! find "$GITHUB_WORKSPACE/dist" \
            -maxdepth 1 -type f -name '*.jar' \
            | grep -q .; then
            echo "ERROR: No mod JAR produced."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
